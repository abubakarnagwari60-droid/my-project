<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <link rel="stylesheet" href="css/register.css">
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="register.html">Register</a>
    </nav>

    <main>

        <h2 class="highlight">Student Registration Form</h2>

        <p class="tagline">Create your student account today.</p>

        <form id="register">

            <label>Full Name:</label>
            <input type="text" placeholder="Enter your full name" required>

            <label>Email Address:</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Password:</label>
            <input type="password" placeholder="Enter password" required>

            <label>Gender:</label>

            <div class="gender">
                <input type="radio" name="gender" required> Male
                <input type="radio" name="gender"> Female
            </div>

            <div class="terms">
                <input type="checkbox" required>
                I agree to the terms and conditions.
            </div>

            <button type="submit">Register</button>
            <button type="reset" class="reset">Clear Form</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Bello Abubakar Nagwari. All Rights Reserved. Student Registration Website</p>
    </footer>

</body>
</html>
